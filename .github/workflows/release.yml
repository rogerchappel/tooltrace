name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASEBOX_REF: v0.1.0

jobs:
  release:
    environment: npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Update npm for trusted publishing
        run: npm install --global npm@latest

      - name: Install ReleaseBox
        run: |
          git clone --depth 1 --branch "$RELEASEBOX_REF" https://github.com/rogerchappel/releasebox.git "$RUNNER_TEMP/releasebox"
          npm ci --prefix "$RUNNER_TEMP/releasebox"
          npm run build --prefix "$RUNNER_TEMP/releasebox"

      - name: ReleaseBox readiness check
        run: node "$RUNNER_TEMP/releasebox/bin/releasebox.js" check .

      - name: Local release check
        run: npm run release:check

      - name: Verify tag matches package version
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

      - name: Pack npm artifact
        id: pack
        run: |
          tarball=$(npm pack --json | node --input-type=module -e "let data=''; for await (const chunk of process.stdin) data += chunk; console.log(JSON.parse(data)[0].filename)")
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"

      - name: Publish verified npm artifact
        run: |
          version="${GITHUB_REF_NAME#v}"
          if npm view "tooltrace@$version" version --json >/dev/null 2>&1; then
            echo "tooltrace@$version already exists; continuing recovery verification"
          else
            npm publish "${{ steps.pack.outputs.tarball }}" --access public --provenance
          fi

      - name: Verify npm registry installation
        run: node scripts/verify-published.mjs "${GITHUB_REF_NAME#v}"

      - name: Generate release notes
        run: node "$RUNNER_TEMP/releasebox/bin/releasebox.js" notes . > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: '*.tgz'
