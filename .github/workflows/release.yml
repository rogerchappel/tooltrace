name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  id-token: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  RELEASEBOX_REF: v0.1.0

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Install dependencies
        run: npm ci

      - name: Install ReleaseBox
        run: |
          git clone --depth 1 --branch "$RELEASEBOX_REF" https://github.com/rogerchappel/releasebox.git "$RUNNER_TEMP/releasebox"
          npm ci --prefix "$RUNNER_TEMP/releasebox"
          npm run build --prefix "$RUNNER_TEMP/releasebox"

      - name: ReleaseBox readiness check
        run: node "$RUNNER_TEMP/releasebox/bin/releasebox.js" check .

      - name: Local release check
        run: npm run release:check

      - name: Pack npm artifact
        run: npm pack

      - name: Generate release notes
        run: node "$RUNNER_TEMP/releasebox/bin/releasebox.js" notes . > RELEASE_NOTES.md

      - uses: softprops/action-gh-release@v2
        with:
          body_path: RELEASE_NOTES.md
          files: '*.tgz'
